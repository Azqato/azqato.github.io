<template id="x-summary" data-title="This Week, explained">
<h4>What it is</h4>
<p>This page sums up the whole report so you can get the picture in a minute or two. It opens with the Executive Summary, a short read of the week, month and year written fresh each week, covering what stood out and what to keep an eye on. Below it are two to four points for each page that follows, in the same order: the first (in bold) is that page's main takeaway, and the rest add context, such as a longer period or a related reading. Each heading links to its page.</p>
<h4>What it means</h4>
<p>Each point below the Executive Summary states what happened and nothing more: which funds rose or fell, which zone a reading is in, and how it changed from last week. The zone names (such as "Moderate" for the VIX or "Fear" for the AAII survey) come from the Index &amp; ETF Method page on this site, so the same reading always gets the same name.</p>
<h4>Guidelines to keep in mind</h4>
<p>A summary leaves things out on purpose. If a line surprises you, open that page and read the details, including its own Explain popup. The points are written by rules, the same way every week, so the wording changes only when the numbers do.</p>
<h4>Where the data comes from</h4>
<p>The same sources as the rest of the report: fund, futures and crypto prices and the VIX from Yahoo Finance; Treasury and TIPS yields from the U.S. Treasury; investor sentiment from the American Association of Individual Investors (AAII); and the Fed funds rate, mortgage and loan rates, CPI and PCE inflation and the high-yield bond spread from the Federal Reserve Bank of St. Louis (FRED). The points are generated by the script that builds this page, using the rules written on the Method page; every figure in the Executive Summary comes from the pages that follow.</p>
<h4>Takeaways</h4>
<p>Use this box to see what changed, then decide which pages are worth a closer look. It describes the market; it does not tell anyone what to do.</p>
</template>

<template id="x-indices" data-title="Returns, explained">
<h4>What it is</h4>
<p>An index is a list of companies whose stock prices are combined into one number, so you can see how a whole part of the market is doing at a glance. You can't buy an index itself, but you can buy a fund that holds every company in it. SPY follows the S&amp;P 500 (500 large US companies, weighted by size, so the biggest count the most), QQQ follows the Nasdaq 100 (the 100 largest non-financial companies on the Nasdaq exchange, many of them tech companies), IWM follows the Russell 2000 (2,000 smaller US companies), and DIA follows the Dow Jones (30 large, well-known companies). RSP holds the same 500 companies as SPY but in equal amounts, so comparing the two shows whether the biggest companies are leading or the typical one.</p>
<p>The other seven are Vanguard funds that slice the market a different way. VUG holds growth companies, whose profits are growing quickly and whose stocks tend to be priced high for it. VTV holds value companies, which are steadier businesses priced lower compared with what they earn. VIG holds companies that have raised their dividend (the cash they pay shareholders) every year for at least ten years. VBR holds smaller US companies priced low for what they earn (small-cap value). VT holds nearly every stock in the world in one fund. VTI holds almost every US stock, around 3,500 companies of every size, and VXUS holds stocks from outside the US, in both developed countries like Japan and Germany and emerging ones like India and Brazil. Together, VTI and VXUS cover about the same ground as VT.</p>
<h4>What it means</h4>
<p>Each column is the fund's total return over that stretch of time, ending at this Friday's close: the price change plus any dividends paid, as if they were put straight back into the fund. "1W" is one week (since last Friday), "1M" one month, "6M" six months, "YTD" year to date (since the last trading day of last year), and "1Y", "5Y" and "10Y" are one, five and ten years. The 5 and 10-year columns are the total gain over the whole period, not a yearly average. Comparing the funds shows which part of the market led. The line under the table names the leader among growth (VUG), value (VTV) and dividend (VIG) funds for the week, the month and the year so far.</p>
<p>Status shows where each fund stands, checked in this order, and the first that applies is shown. <b>Bear</b> (red): the price is 20% or more below its highest close of the past 52 weeks. <b>Correction</b> (red): 10% or more below that high. <b>Bull</b> (green): 20% or more above its lowest close of the past 52 weeks, which by then also means within 10% of the high. These follow the common market convention that a 10% drop is a correction and a 20% move marks a bear or bull market, measured here over the past year. Otherwise Status is the trend against the average of the last 200 trading days: Rising (green) more than 5% above it, Falling (red) more than 5% below, and Steady in between. The 5% band is wider than the 2% the Index &amp; ETF Method uses for its 200-day signal, so a fund can be Above on the Signals page and still Steady here. The % column next to it, in brackets, is the figure that decided the label: the distance from the 52-week high for Bear and Correction, from the 52-week low for Bull, and from the 200-day average otherwise. Status uses prices, not total return. It describes where things stand, not what comes next.</p>
<h4>Guidelines to keep in mind</h4>
<p>One week is a very short time. It is normal for stock prices to rise or fall a few percent in a week for no lasting reason, so the longer columns give better context than a single week. Over many decades, US stocks have grown about 10% a year on average with dividends included, but that average includes years with big losses. Compare funds against each other rather than reading too much into one number on its own.</p>
<h4>Where the data comes from</h4>
<p>Prices come from Yahoo Finance, using its "adjusted" closing prices, which build dividends into the price history. Each return is this Friday's adjusted close divided by the adjusted close at the start of the period, minus 1, shown as a percent; when the start date falls on a weekend or holiday, the last close before it is used. This is the same total-return method the ETF screener on this site uses. "n/a" means the fund did not exist yet at the start of the period.</p>
<h4>Takeaways</h4>
<p>Think of this table as the scoreboard. It tells you what happened, not what will happen next. Long-term results come mostly from time spent invested rather than from any one week, so a strong or weak week is a reason to understand what moved, not a reason on its own to change a plan.</p>
</template>

<template id="x-aaii" data-title="AAII Survey, explained">
<h4>What it is</h4>
<p>The American Association of Individual Investors (AAII) is a nonprofit group for everyday investors. Since 1987 it has asked its members the same question every week: do you think the stock market will be higher, about the same, or lower six months from now? "Bullish" means they expect it to go up, "bearish" means they expect it to go down, and "neutral" means they expect little change. The bull-bear spread is the bullish share minus the bearish share.</p>
<h4>What it means</h4>
<p>The Method page on this site focuses on the bearish share and sorts it into five zones: Optimism (below 25% bearish), Average (25 to 35%), Concern (35 to 50%), Fear (50 to 60%) and Extreme (above 60%). The colored bar shows where this week falls, with last week in grey. The boxes below it show the zone, the spread compared with its long-run average, how much the bearish share changed over one week and over the last few weeks, and how many weeks in a row bearish readings have outnumbered bullish ones. The chart shows the recent weeks side by side.</p>
<h4>Guidelines to keep in mind</h4>
<p>The method reads this survey as a "contrarian" signal: when almost everyone is scared, many have already sold, so the extreme bearish readings of the past have tended to come near market lows rather than at the start of a fall. The method is also clear that this is a pattern, not a rule: one extreme week counts for less than several weeks in a row, and the survey is meant to be read alongside the VIX and the other timing signals, never on its own.</p>
<h4>Where the data comes from</h4>
<p>Each week's reading is published by AAII at aaii.com/sentimentsurvey; survey weeks end on a Wednesday and results come out on Thursday. Until a full history is loaded, the historical averages and 1-year highs are shown exactly as AAII publishes them. When AAII's full history is available, the report calculates those itself and adds the percentile (how this week compares with every week since 1987) and the past S&amp;P 500 returns after weeks with bearish above 50%. Those past returns use S&amp;P 500 prices from Yahoo Finance and are history, not a forecast.</p>
<h4>Takeaways</h4>
<p>This survey is a mirror of how regular investors feel. It is most useful as a check on your own emotions: if you feel the urge to sell when everyone is gloomy, or to buy because everyone is excited, this is a reminder that the crowd's mood is already part of the price.</p>
</template>

<template id="x-vix" data-title="VIX, explained">
<h4>What it is</h4>
<p>The VIX is a number calculated by Cboe, a US options exchange, from the prices people pay for options on the S&amp;P 500. Options work a bit like insurance: when investors are worried about a drop, they pay more for protection, and the VIX goes up. A VIX of 20 roughly means the market expects the S&amp;P 500 to move about 20% over a year, up or down, which works out to about 6% over the next month. That is why it is nicknamed the "fear gauge."</p>
<h4>What it means</h4>
<p>The Method page sorts the VIX into five zones: Complacent (below 15), Moderate (15 to 25), Elevated (25 to 35), High (35 to 45) and Crisis (above 45). The bar shows where it is this week, with last week in grey. The boxes show how it changed over a week and a month, where today's reading ranks against the past year (the percentile), its range over the past year, and the "term structure": the VIX compared with the 3-month VIX. Normally the 3-month figure is higher; when the short-term VIX is higher instead ("Inverted"), worry about the next few weeks is running ahead of worry about the months after. The strip shows how many trading days of the past year fell in each zone, and the chart shows every daily close over the same year, with its low and high marked.</p>
<h4>Guidelines to keep in mind</h4>
<p>The VIX tends to come back toward the middle: spikes don't last, and very calm periods don't last either. The method calls it the most actionable timing signal for index funds and reads it the contrarian way, where high fear has historically come before recoveries and very low fear before pullbacks. A high VIX does not mean prices must rise next week; it means prices are being driven by fear more than usual.</p>
<h4>Where the data comes from</h4>
<p>Daily closes of the VIX and the 3-month VIX (VIX3M) come from Yahoo Finance. The percentile is the share of the last 252 trading days (about a year) that closed below today's reading. The gap to the 50-day average, in the notes on this page, is today's VIX divided by its average over the last 50 trading days, minus 1. Zones and their descriptions are taken word for word from the Method page.</p>
<h4>Takeaways</h4>
<p>The VIX is the market's own estimate of how bumpy the ride will be. Knowing which zone it is in helps put the headlines in context: a scary news week with a Moderate VIX is very different from one in the High or Crisis zones.</p>
</template>

<template id="x-timing" data-title="Signals, explained">
<h4>What it is</h4>
<p>The Method page names five "timing signals" that it uses to judge whether a moment is a good one to put extra money into an index fund. Two are about the whole market: the VIX and the AAII bearish share. Three are about each fund: RSI, where the price sits in its 52-week range, and how the price compares with its 200-day average. This page shows all five for every major fund and for the 11 sector funds.</p>
<h4>What it means</h4>
<p><b>RSI</b> (Relative Strength Index) is a score from 0 to 100 that compares recent up days with recent down days over 14 trading days. Below 30 means the fund has fallen hard lately (Oversold), 30 to 45 is a pullback, 45 to 60 is neutral, 60 to 70 is elevated, and above 70 means it has risen fast (Overbought). The <b>52-week range</b> shows where today's price sits between the lowest and highest prices of the past year: 0% is the low and 100% is the high. <b>vs 200-day</b> compares the price with its average over the last 200 trading days; being above it means the long-term trend is up. Each reading gets a one-word label and a color: green for Strong, red for Caution and grey for Neutral, using the method's "What Strong Signals Look Like" table. The last columns count how many of the five signals are Strong and how many are Caution. The combined tier comes from the method's rules for reading AAII and the VIX together.</p>
<h4>Guidelines to keep in mind</h4>
<p>The signals are meant to be read together. The method's strongest setup is when they line up: a high VIX, heavy bearish sentiment, a low RSI and a price near its 52-week low, while the price still holds above its 200-day average. A single Strong reading on its own means much less. The method also says these signals are for extra cash you already have, not a reason to pause regular investing from each paycheck.</p>
<h4>Where the data comes from</h4>
<p>Prices come from Yahoo Finance and are calculated the same way as the ETF screener on this site: RSI is the 14-day Wilder RSI over the past year of closing prices; the 52-week range uses each day's highest and lowest trade; the 200-day average uses closing prices. The VIX and AAII readings are the ones on their own pages. Where the method leaves a gap between its bands (RSI 60 to 70, the 75 to 90% part of the range, and prices within 2% of the 200-day average), the labels Elevated, Upper and Average fill it.</p>
<h4>Takeaways</h4>
<p>This page turns the method's rules into a checklist you can scan in seconds. Most weeks, most funds will be Neutral on most signals, and that is normal: the method's strongest setups are rare by design.</p>
</template>

<template id="x-sectors" data-title="Sectors, explained">
<h4>What it is</h4>
<p>The stock market is often split into 11 sectors, groups of companies in the same kind of business: technology, communication (such as media and social networks), consumer discretionary (things people want but can skip, like cars and travel), consumer staples (things people buy anyway, like food and soap), financials, health care, industrials, energy, materials, utilities and real estate. The Select Sector SPDR funds hold the companies of the S&amp;P 500, one fund per sector.</p>
<h4>What it means</h4>
<p>Each column is the fund's total return over that period, the same way as the funds above it in the Returns table, and the table is sorted so this week's best sector is at the top. When sectors like technology and consumer discretionary lead, investors are usually leaning toward growth and spending; when staples, utilities and health care lead, they are usually leaning toward steadier businesses. Energy and materials often follow the prices of oil and raw materials.</p>
<h4>Guidelines to keep in mind</h4>
<p>Sector funds are less spread out than a fund that holds the whole market, so their ups and downs are bigger and a slump in one industry can last a long time. The Method page treats them as smaller, higher-risk positions next to broad market funds, and its timing signals for them are on the Signals page.</p>
<h4>Where the data comes from</h4>
<p>Prices come from Yahoo Finance, using adjusted closes so dividends are included, exactly like the funds above them. "n/a" means the fund is younger than the period: the communication fund (XLC) started in 2018.</p>
<h4>Takeaways</h4>
<p>Sector returns show which parts of the economy investors are favoring. A big week for the whole market can hide large differences underneath, and this table makes them visible.</p>
</template>

<template id="x-mood" data-title="Market Mood, explained">
<h4>What it is</h4>
<p>Investors are people, and how confident or nervous they feel shows up in prices. This section tracks four measurements that tend to change when investors as a group are feeling confident or worried. Each one is measured the same way every week, so you can compare this week to last week fairly. The VIX, a fifth mood reading, has its own page.</p>
<h4>What it means</h4>
<p><b>Momentum</b> compares the S&amp;P 500 with its average price over the last 125 trading days (about six months); above the average means prices have been climbing. <b>Breadth</b> is the share of the 500 companies trading above their own 200-day average; a high number means most companies are rising together, and a low one means a few big companies are carrying the index. <b>Safe-haven demand</b> compares stocks (SPY) with long-term government bonds (TLT) over 20 trading days; when people are worried they move money into bonds, so a negative number means bonds did better. <b>Junk bond demand</b> is the extra interest that companies with weaker finances must pay to borrow, compared with the government; that gap widens when lenders get nervous.</p>
<h4>Guidelines to keep in mind</h4>
<p>No single reading tells the whole story. Look at whether they agree: if most point the same way, the mood is clear; if they disagree, the market is mixed. Extremes matter more than readings near the middle. Mood describes how people feel right now, and it can change quickly; historically, very fearful periods have often come near market lows, but mood has never been a reliable way to pick the exact day to buy or sell.</p>
<h4>Where the data comes from</h4>
<p>Momentum, breadth and safe-haven demand are calculated from Yahoo Finance closing prices. Momentum is the S&amp;P 500 divided by its 125-day average, minus 1. Breadth counts how many S&amp;P 500 members closed above their 200-day average. Safe-haven demand is SPY's 20-day return minus TLT's 20-day return. The junk bond spread is the ICE BofA US High Yield Index option-adjusted spread, published daily by the Federal Reserve Bank of St. Louis (FRED).</p>
<h4>Takeaways</h4>
<p>Mood moves much faster than the businesses underneath it. A company does not become half as valuable because investors had a nervous week, which is why these readings are best used to understand the headlines, and to notice when your own feelings are simply following the crowd.</p>
</template>

<template id="x-yields" data-title="Rates, explained">
<h4>What it is</h4>
<p>When the US government needs to borrow money, it sells bonds called Treasuries. A bond is a loan: you give the government money now, it pays you interest, and it pays the money back on a set date. The yield is the yearly interest rate a buyer earns by holding the bond until that date. Treasuries come in different lengths, from 1 month to 30 years, and the table shows ten of them. The Muni (MUB) row stands for municipal bonds, issued by states and cities, whose interest is usually free of federal income tax. No free source publishes a muni yield history, so the row uses MUB, the iShares National Muni Bond ETF: its current yield, and in place of yield changes, its total return over each period (price change plus interest paid), in basis points, so +100 means +1%. A gain is green, because muni prices rise when their yields fall, and its Status reads the yield direction from the past month's return. The same section has TIPS (Treasury Inflation-Protected Securities): Treasuries whose value rises with inflation, so their yield is what you earn on top of inflation, called a real yield. The 10-year breakeven rate, the 10-year Treasury yield minus the 10-year TIPS yield, is roughly the yearly inflation the bond market expects.</p>
<p>The yield curve rows show the gap, in percentage points, between the 10-year and 2-year yields, between the 30-year and 10-year yields, between the Fed funds rate and CPI inflation over 12 months (Real Fed Funds, the Fed funds rate after inflation, using the same CPI month as the CPI row), and between the 2, 10 and 30-year yields and the Fed funds rate, the overnight rate the Federal Reserve steers. The second section has the Fed funds rate, the average 30 and 15-year mortgage rates, the rate on credit cards that charge interest, a 60-month new car loan, and inflation.</p>
<p>Status: a Treasury or TIPS yield is Inverted (red) when it is below the yield of a shorter maturity, and a yield curve gap when it is below zero; Inverted comes before anything else. Otherwise Status is the move over the past month: Rising or Falling at 10 basis points or more, otherwise Steady. Rising is red and Falling green. The yield curve rows are not colored, as a wider or narrower gap is neither good nor bad news on its own. A gap is Steepening when it widened by 10 basis points or more over the past month (the longer yield pulling away from the shorter one), Flattening when it narrowed by that much, otherwise Steady. Real Fed Funds is not a gap between two yields, so it is never Inverted: below zero it is Behind (red), meaning CPI inflation is above the Fed funds rate; otherwise it is Rising, Falling or Steady.</p>
<p>Inflation is how fast prices are rising. Two rows in the second section, CPI and PCE, are the two official measures, each the rise over 12 months. CPI, the Consumer Price Index from the Bureau of Labor Statistics, tracks the prices of a basket of things households buy. PCE, Personal Consumption Expenditures from the Bureau of Economic Analysis, is broader and is the one the Federal Reserve aims to keep at 2% a year. Each row gives the rise over the 12 months to the month shown, and how much that rate has moved over each period, in basis points. They come out monthly (CPI around the middle of the following month, PCE about two weeks later), so most weeks they are unchanged and the 1-week change shows +0.</p>
<h4>What it means</h4>
<p>When a yield goes up, borrowing becomes more expensive across the economy, because mortgages, car loans and company loans are priced off these rates; savers, on the other hand, earn more. Changes are shown in basis points, where 100 basis points equals 1 percentage point, so "+29 bps" means the yield rose by 0.29 points. In the table a rise is shown in red and a fall in green, because when a yield rises the price of existing bonds falls; rates and inflation follow the same colors. Short-term yields mostly follow the interest rate set by the Federal Reserve, while long-term yields reflect what investors expect for growth and inflation over many years. Normally longer bonds pay more; when short-term yields are higher than long-term ones, the "yield curve" is called inverted, which has often, but not always, come before a recession.</p>
<h4>Guidelines to keep in mind</h4>
<p>A move of 10 to 20 basis points in a week is notable, and 50 or more is large. Bond prices and yields move in opposite directions, like a seesaw: when yields rise, the price of existing bonds falls. Rising yields can weigh on stock prices, especially fast-growing companies, because a safe 5% from the government makes riskier investments look less attractive by comparison. The 10-year yield is the one most people watch, since mortgage rates tend to follow it.</p>
<h4>Where the data comes from</h4>
<p>All ten Treasury yields and the TIPS yields come from the U.S. Treasury's daily yield curves (home.treasury.gov), which it publishes the same afternoon, so they are Friday's close. Their history, for the changes, comes from FRED, the Federal Reserve Bank of St. Louis's free data service, which carries the same curves. The Fed funds rate comes from FRED, which posts each day's reading a day or so later, so it and the yield curve gaps built on it are usually as of Thursday, and the note under the table names them. The mortgage rates are Freddie Mac's weekly survey, published on Thursdays, and the credit card and car loan rates are the Fed's quarterly survey of banks, all through FRED. Each change is the latest yield minus the yield at the start of the period (last Friday, a month ago, the end of last year, and so on), multiplied by 100 to put it in basis points. The 10-year breakeven rate is the 10-year Treasury yield minus the 10-year TIPS yield on the same day. The month next to a rate is the month of its latest reading.</p>
<h4>Takeaways</h4>
<p>Interest rates are the price of money, and they touch nearly everything: what a home costs to finance, what a savings account pays, and how investors value stocks. When the headlines say rates moved, this table shows by how much and for which lengths of loan.</p>
</template>

<template id="x-cmd" data-title="Other Markets, explained">
<h4>What it is</h4>
<p>The first part of the table tracks important prices outside the stock market. Oil is shown two ways: WTI, the US benchmark, and Brent, the global one. Natural gas heats homes and runs power plants. Gold, silver and platinum are precious metals; gold is the one people have used to store value for thousands of years, while silver and platinum also have heavy industrial use. Copper goes into wiring, buildings and electronics. The US Dollar row is the US Dollar Index, which measures the dollar against six major currencies, such as the euro and the Japanese yen. Below it are seven other currencies, each as its own index: the Chinese yuan (CNY), euro (EUR), Japanese yen (JPY), British pound (GBP), Korean won (KRW), Canadian dollar (CAD) and Swiss franc (CHF). Each index is the currency's value in US cents (for the yen and the won, the value of 100 of them), so a rise always means that currency got stronger and a fall that it got weaker.</p>
<p>Cryptocurrencies are digital assets with no company or government behind them. Bitcoin and Ethereum are the two largest. The rest of the list are other large coins: BNB, XRP, Solana, TRON, Dogecoin, Zcash, Cardano, Monero and Litecoin. Some run their own networks for payments or apps; Zcash and Monero are built to keep transactions private; Dogecoin began as a joke.</p>
<h4>What it means</h4>
<p>Oil and natural gas prices flow into fuel, heating and the cost of shipping almost everything, so they affect inflation. Gold often rises when people are worried or when they expect money to lose value. Copper is used so widely in building and manufacturing that its price is often read as a sign of how busy the world economy is. A stronger dollar makes imports and foreign travel cheaper for Americans, but makes US goods more expensive abroad, which can hurt companies that sell overseas, and it lowers the value of foreign stocks (such as VXUS) for US investors.</p>
<p>Crypto prices move mainly on investor demand and can swing far more than stocks. The coins tend to rise and fall together, usually following Bitcoin, so a week where most of the list moves the same way says more about crypto as a whole than about any one coin.</p>
<h4>Guidelines to keep in mind</h4>
<p>These prices are much jumpier than the major stock indexes: a 10% week is not unusual for oil or natural gas. Look for connections rather than reading each number alone. Rising oil can push up inflation, which can push up bond yields; gold and the dollar often move in opposite directions. Futures prices can differ slightly from the prices quoted in the news, which may use a different contract.</p>
<p>A 10% week is ordinary for Bitcoin and smaller coins can move far more. Coins that are younger or smaller can lose most of their value and stay down for years. Long-run figures depend heavily on the starting point: a coin bought near a peak can still be down years later.</p>
<h4>Where the data comes from</h4>
<p>All prices come from Yahoo Finance. Each commodity is its front-month futures contract (CL=F for WTI, BZ=F for Brent, NG=F for natural gas, GC=F for gold, SI=F for silver, PL=F for platinum, HG=F for copper), at this Friday's close. The dollar index is the ICE US Dollar Index. The euro, yen, pound, Canadian dollar and Swiss franc are the PHLX currency indexes published by Nasdaq; Yahoo Finance has none for the yuan or the won, so those two are built the same way from Yahoo's exchange rates (100 divided by the yuan per dollar, and 10,000 divided by the won per dollar). All at Friday's close. Each change is the latest price divided by the price at the start of the period (a week, a month, 6 months, the last year-end, 1, 5 or 10 years back), minus 1. These are price changes only: none of them pay dividends. Status works as on Returns: Bear, Correction or Bull from the 52-week high and low first, otherwise the trend against the 200-day average.</p>
<p>Crypto prices are in US dollars. Crypto trades around the clock, every day, so each price is the latest available when the report is made, not a Friday close. Each change is that price divided by the price at the start of the period, minus 1. Most coins have traded for less than 10 years, so their 10Y is n/a. Status works as on Returns: Bear, Correction or Bull from the 52-week high and low first, otherwise the trend against the 200-day average.</p>
<h4>Takeaways</h4>
<p>These markets are the background to the stock market. When stocks have a strange week, the explanation is often here: an oil price jump, a sudden rush into gold, or a sharp move in the dollar. Reading them together gives a fuller picture than any one of them alone.</p>
<p>Crypto is the most volatile part of this report. Read the week alongside the longer periods: a sharp week can be noise inside a long trend, or the start of one.</p>
</template>
