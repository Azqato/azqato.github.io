<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azqato | Music</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦁</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    :root {
      --spotify: #1db954;
    }

    /* ── HERO ── */
    .hero {
      max-width: 1100px;
      margin: 0 auto;
      padding: 5rem 2rem 3rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--tag-bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.25rem 0.75rem;
      font-size: 0.78rem;
      color: var(--green);
      width: fit-content;
    }

    .hero-badge::before {
      content: '';
      width: 7px;
      height: 7px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.5px;
    }

    .hero h1 .highlight { color: var(--accent); }

    .hero p {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 560px;
    }

    /* ── SECTION ── */
    .section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 2rem 4rem;
    }

    /* ── STAGE CONSOLE (embeds + links, docked on the center screen) ── */
    .stage-console {
      position: fixed;
      top: 13vh;
      left: 50%;
      transform: translateX(-50%);
      width: clamp(280px, 38vw, 560px);
      height: clamp(220px, 36vh, 460px);
      z-index: 1;
      background: rgba(10, 12, 20, 0.62);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4), 0 12px 32px rgba(0,0,0,0.5);
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .stage-console::-webkit-scrollbar { width: 6px; }
    .stage-console::-webkit-scrollbar-track { background: transparent; }
    .stage-console::-webkit-scrollbar-thumb { background: rgba(188, 140, 255, 0.35); border-radius: 999px; }
    .stage-console::-webkit-scrollbar-thumb:hover { background: rgba(188, 140, 255, 0.55); }
    .stage-console { scrollbar-width: thin; scrollbar-color: rgba(188, 140, 255, 0.35) transparent; }

    .console-embed {
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
      transition: border-color 0.2s;
    }

    .console-embed:hover { border-color: var(--purple); }

    .console-embed iframe {
      width: 100%;
      height: 120px;
      border: none;
      display: block;
    }

    /* ── NATIVE TRACK PLAYER ── */
    /* Unlike the Mixcloud embeds beside it, this player is same-origin, so the
       page can route it through Web Audio and drive the visualizer from the
       real signal. See the analyser wiring in the script below. */
    .console-player {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 0.75rem 0.85rem;
      border-radius: 8px;
      border: 1px solid rgba(188, 140, 255, 0.25);
      background: rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
      transition: border-color 0.2s;
    }

    .console-player:hover { border-color: var(--purple); }

    .track-row {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .track-playbtn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .track-playbtn:hover {
      border-color: var(--purple);
      background: rgba(188, 140, 255, 0.12);
    }

    .track-meta { display: flex; flex-direction: column; min-width: 0; }
    .track-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-tag {
      font-size: 0.65rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--purple);
    }
    .track-note {
      font-size: 0.6rem;
      letter-spacing: 0.03em;
      color: var(--muted);
    }

    .track-scrub {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .track-time {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
      width: 2.6em;
    }

    .track-time:last-child { text-align: right; }

    .track-seek {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.15);
      cursor: pointer;
    }

    .track-seek::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--purple);
      border: none;
      cursor: pointer;
    }

    .track-seek::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--purple);
      border: none;
      cursor: pointer;
    }

    .track-seek:disabled { cursor: default; opacity: 0.5; }

    .console-links {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .console-link {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 0.55rem 0.8rem;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s;
    }

    .console-link:hover {
      background: rgba(188, 140, 255, 0.1);
      border-color: var(--purple);
    }

    .console-link .platform-icon { font-size: 1.15rem; line-height: 1; }

    .console-link .platform-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
    }

    /* ── VISUALIZER ── */
    #viz {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    nav, .hero, .section, footer {
      position: relative;
      z-index: 1;
    }

    .viz-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.9rem;
      background: rgba(22, 27, 34, 0.88);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
      text-decoration: none;
      font-family: inherit;
    }

    .viz-btn:hover { border-color: var(--purple); color: var(--purple); }
    .viz-btn.active { border-color: var(--purple); color: var(--purple); background: rgba(188,140,255,0.1); }

    /* Play/pause for the stage animation. Separated from the mode pills so it
       reads as a control over the whole scene rather than another mode. */
    .motion-btn { border-color: rgba(0, 212, 160, 0.45); color: var(--accent); margin-right: 0.35rem; }
    .motion-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(0, 212, 160, 0.1); }

    .mode-controls {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.5rem;
      z-index: 10;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .hero { padding: 3rem 1.25rem 2rem; }
      .section { padding: 0 1.25rem 3rem; }
    }
  </style>

  <script>
    /* ── VISUALIZER ── */
    (function () {
      var canvas = document.getElementById('viz');
      var ctx    = canvas.getContext('2d', { alpha: false });
      var W, H;
      var DPR    = Math.min(window.devicePixelRatio || 1, 2);
      var lay    = {};

      // Prerendered cinematic grade (vignette + letterbox), rebuilt on resize
      var vigC   = document.createElement('canvas');
      var vigCtx = vigC.getContext('2d');
      // Half-res floor reflection buffer
      var reflC   = document.createElement('canvas');
      var reflCtx = reflC.getContext('2d');
      // Tiny buffer for cheap panel bloom (upscale blur trick)
      var bloomC   = document.createElement('canvas');
      bloomC.width = 64; bloomC.height = 40;
      var bloomCtx = bloomC.getContext('2d');
      // LED scanline pattern (built once)
      var scanPattern = (function () {
        var pc = document.createElement('canvas');
        pc.width = 1; pc.height = 3;
        var pctx = pc.getContext('2d');
        pctx.fillStyle = 'rgba(0,0,0,0.55)';
        pctx.fillRect(0, 0, 1, 1);
        return ctx.createPattern(pc, 'repeat');
      })();

      function build() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width  = Math.round(W * DPR);
        canvas.height = Math.round(H * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        var cx = W / 2;

        // Cinematic grade: vignette + top letterbox, prerendered once per resize
        vigC.width = Math.max(1, W >> 1); vigC.height = Math.max(1, H >> 1);
        var vw = vigC.width, vh = vigC.height;
        vigCtx.clearRect(0, 0, vw, vh);
        var vg = vigCtx.createRadialGradient(vw/2, vh*0.44, Math.min(vw,vh)*0.42, vw/2, vh*0.44, Math.max(vw,vh)*0.78);
        vg.addColorStop(0, 'rgba(0,0,8,0)');
        vg.addColorStop(0.7, 'rgba(0,0,8,0.18)');
        vg.addColorStop(1, 'rgba(0,0,10,0.52)');
        vigCtx.fillStyle = vg; vigCtx.fillRect(0, 0, vw, vh);
        var lb = vigCtx.createLinearGradient(0, 0, 0, vh * 0.12);
        lb.addColorStop(0, 'rgba(0,0,0,0.4)'); lb.addColorStop(1, 'rgba(0,0,0,0)');
        vigCtx.fillStyle = lb; vigCtx.fillRect(0, 0, vw, vh * 0.12);

        // Reflection buffer at half device res
        reflC.width  = Math.max(1, Math.floor(W * DPR / 2));
        reflC.height = Math.max(1, Math.floor(H * 0.24 * DPR / 2));

        lay.cx = cx;

        // Trusses
        lay.truss1Y = H * 0.09;
        lay.truss2Y = H * 0.14;
        lay.truss3Y = H * 0.53;
        lay.trussL  = W * 0.02;
        lay.trussR  = W * 0.98;

        // ── Brooklyn Mirage panoramic screen layout ──
        // All 5 screens share the same Y and height for a seamless panoramic band

        var sY = H * 0.10; // screen top
        var sH = H * 0.42; // screen height (all same)

        // Wide center screen (Brooklyn Mirage style)
        lay.mainX    = cx - W * 0.21;
        lay.mainY    = sY;
        lay.mainW    = W * 0.42;
        lay.mainH    = sH;
        lay.mainCols = 24;
        lay.mainRows = 8;

        // Side panels: separate structures with gap from center screen, pivot at inner edge
        lay.wingLX = W * 0.04; lay.wingLY = sY;
        lay.wingLW = W * 0.22; lay.wingLH = sH;
        lay.wingRX = W * 0.74; lay.wingRY = sY;
        lay.wingRW = W * 0.22; lay.wingRH = sH;
        lay.wingAngle = 0;

        // Stage floor
        lay.floorY    = H * 0.645;
        lay.floorBotY = H * 0.885;
        lay.floorTopW = W * 0.58;
        lay.floorBotW = W * 0.98;

        // DJ booth: front fascia (branded face) + raked side cheeks + top deck (CDJs/mixer)
        lay.boothW     = W * 0.25;  lay.boothH = H * 0.10;
        lay.boothY     = H * 0.700;
        lay.boothFlare = 1.3;  // bottom of the fascia is wider than the top (booth viewed from below)
        lay.boothCheek   = lay.boothW * 0.10;
        lay.boothGroundH = lay.boothH * 1.6; // solid base extends well past the branded panel, down to the floor

        lay.deckH      = lay.boothH * 0.42;
        lay.deckY      = lay.boothY - lay.deckH;
        lay.deckFrontW = lay.boothW * 1.05;
        lay.deckBackW  = lay.boothW * 0.85;

        lay.cdjW  = lay.deckFrontW * 0.22;
        lay.cdjH  = lay.deckH * 0.68;
        lay.cdjY  = lay.boothY - lay.cdjH * 0.9;
        lay.cdjLX = cx - lay.deckFrontW * 0.42;
        lay.cdjRX = cx + lay.deckFrontW * 0.20;

        // Mixer LED grid, between the two CDJs
        lay.bsW = lay.deckFrontW * 0.24; lay.bsH = lay.cdjH * 1.1;
        lay.bsX = cx - lay.bsW / 2;      lay.bsY = lay.cdjY - lay.bsH * 0.06;

        // Fire columns
        lay.fireY = lay.floorBotY;
        lay.fireXs = [-0.24, -0.12, 0.12, 0.24].map(function(o){ return cx + o * W; });

        // Laser origin
        lay.laserOX = cx;
        lay.laserOY = lay.boothY + lay.boothH * 0.3;
      }
      build();
      window.addEventListener('resize', function () {
        build();
        if (!rafId) draw();  // keep the still frame correct while paused
      });

      // ── Web Audio: the native track feeds the analyser ──
      // Until a track plays these stay null and freq() falls back to a synthetic
      // wave, so the stage still animates for a visitor who never presses play.
      var analyser = null, freqData = null, audioCtx = null, audioWired = false;
      var trackAudio = document.getElementById('trackAudio');

      // A second analyser, high resolution and completely unsmoothed, used only to
      // find kicks. The general analyser above is deliberately smoothed for the
      // ambient visuals and far too coarse to isolate a kick: at fftSize 256 each
      // bin spans about 190 Hz, so the entire 30-150 Hz kick band is part of one
      // bin. At 2048 a bin is about 23 Hz, which resolves it properly.
      var analyserFast = null, freqDataFast = null;
      var fastLoBin = 1, fastHiBin = 6;

      // Opened as a local file, the browser treats the mp3 as cross-origin even
      // though it sits next to this page. createMediaElementSource then succeeds
      // but routes silence, so the track plays with no sound at all. Skip the
      // graph entirely in that case: the element plays normally and the stage
      // runs synthetic. Serve over http (python -m http.server) to test for real.
      var canRouteAudio = location.protocol !== 'file:';

      function initAudio() {
        if (audioCtx || !canRouteAudio) return;
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;  // no Web Audio: the player still works, the stage stays synthetic
        audioCtx = new Ctx();
        analyser = audioCtx.createAnalyser();
        // 1024 rather than 256: at 256 a bin spans about 190 Hz, which is wider
        // than the entire kick band, so the low end could not be resolved at all.
        // Not 2048 either. Frequency resolution and time resolution trade against
        // each other, and 2048 spans 46 ms of audio, longer than a frame at 60 fps,
        // which smears the transients this whole change exists to preserve. The
        // kick detector below uses 2048 because it needs the opposite trade.
        analyser.fftSize = 1024;
        // 0.35 rather than 0.8. The old value was a second low-pass filter stacked
        // on top of freq()'s own smoothing, and between them every attack was
        // rounded off before it reached the screen. freq() now does the smoothing,
        // asymmetrically, so this stage only needs to take the jitter off.
        analyser.smoothingTimeConstant = 0.35;
        analyser.minDecibels = -90;
        analyser.maxDecibels = -10;
        freqData = new Uint8Array(analyser.frequencyBinCount);
        analyser.connect(audioCtx.destination);

        analyserFast = audioCtx.createAnalyser();
        analyserFast.fftSize = 2048;
        analyserFast.smoothingTimeConstant = 0;  // smoothing destroys the attack we are looking for
        analyserFast.minDecibels = -90;
        analyserFast.maxDecibels = -10;
        freqDataFast = new Uint8Array(analyserFast.frequencyBinCount);
        // Sample rate varies by device, so derive the bin range rather than hardcoding it.
        var binHz = audioCtx.sampleRate / analyserFast.fftSize;
        fastLoBin = Math.max(1, Math.round(30 / binHz));
        fastHiBin = Math.max(fastLoBin, Math.round(150 / binHz));
        // Not connected to the destination: it is a tap, and connecting it would
        // add a second copy of the signal to the output.
      }

      // createMediaElementSource can only be called once per element, and once
      // called it reroutes the audio through the graph, so this must run before
      // the first play and never again.
      function wireAudio(media) {
        if (audioWired || !canRouteAudio || !audioCtx || !analyser) return;
        try {
          var src = audioCtx.createMediaElementSource(media);
          src.connect(analyser);
          src.connect(analyserFast);
          audioWired = true;
        } catch (e) {
          // Already routed, or blocked. Leave the element playing on its own and
          // fall back to the synthetic signal rather than killing playback.
          console.error('Web Audio wiring failed:', e);
          analyser = null;
          freqData = null;

        ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(cx2 - tw/2, sy); ctx.lineTo(cx2 + tw/2, sy);
        ctx.lineTo(cx2 + bw/2, by); ctx.lineTo(cx2 - bw/2, by); ctx.closePath(); ctx.fill();
        // grid
        ctx.globalAlpha = 0.07 + b * 0.11; ctx.strokeStyle = '#0055bb'; ctx.lineWidth = 1;
        for (var i = 1; i < 8; i++) {
          var fr = i / 8, lw2 = tw + (bw - tw) * fr, ly2 = sy + (by - sy) * fr;
          ctx.beginPath(); ctx.moveTo(cx2 - lw2/2, ly2); ctx.lineTo(cx2 + lw2/2, ly2); ctx.stroke();
        }
        for (var j = -5; j <= 5; j++) {
          ctx.beginPath(); ctx.moveTo(cx2 + j * (tw/11), sy); ctx.lineTo(cx2 + j * (bw/9), by); ctx.stroke();
        }
        // front LED strip
        ctx.globalAlpha = 1;
        var sg = ctx.createLinearGradient(cx2 - bw/2, 0, cx2 + bw/2, 0);
        sg.addColorStop(0,    'hsla(290,100%,55%,' + (0.12 + b * 0.88) + ')');
        sg.addColorStop(0.25, 'hsla(200,100%,60%,' + (0.2  + b * 0.8)  + ')');
        sg.addColorStop(0.5,  'hsla(50,100%,65%,'  + (0.25 + b * 0.75) + ')');
        sg.addColorStop(0.75, 'hsla(200,100%,60%,' + (0.2  + b * 0.8)  + ')');
        sg.addColorStop(1,    'hsla(290,100%,55%,' + (0.12 + b * 0.88) + ')');
        ctx.strokeStyle = sg; ctx.lineWidth = 4 + b * 7;
        ctx.shadowColor = '#4488ff'; ctx.shadowBlur = 10 + b * 22;
        ctx.beginPath(); ctx.moveTo(cx2 - bw/2, by); ctx.lineTo(cx2 + bw/2, by); ctx.stroke();
        ctx.restore();
      }

      // Mirror the stage band (screens, logo, triangle) onto the glossy floor
      function drawReflection() {
        var srcY = lay.mainY;
        var srcH = lay.floorY - lay.mainY;
        if (srcH <= 0) return;
        var rw = reflC.width, rh = reflC.height;
        reflCtx.setTransform(1, 0, 0, 1, 0, 0);
        reflCtx.clearRect(0, 0, rw, rh);
        // vertical flip: floor line maps to top of the buffer
        reflCtx.translate(0, rh);
        reflCtx.scale(1, -1);
        reflCtx.drawImage(canvas, 0, srcY * DPR, W * DPR, srcH * DPR, 0, 0, rw, rh);
        // fade out with distance from the mirror line
        reflCtx.setTransform(1, 0, 0, 1, 0, 0);
        reflCtx.globalCompositeOperation = 'destination-in';
        var fg = reflCtx.createLinearGradient(0, 0, 0, rh);
        fg.addColorStop(0,    'rgba(255,255,255,0.55)');
        fg.addColorStop(0.55, 'rgba(255,255,255,0.10)');
        fg.addColorStop(1,    'rgba(255,255,255,0)');
        reflCtx.fillStyle = fg;
        reflCtx.fillRect(0, 0, rw, rh);
        reflCtx.globalCompositeOperation = 'source-over';
        // composite additively: light on a dark glossy floor
        ctx.save();
        // punch a hole over the DJ booth so its reflected ghosting doesn't wash over the booth itself
        var bpad = lay.boothH * 0.5;
        var boothGroundW  = lay.boothW + ((lay.boothW * lay.boothFlare) - lay.boothW) / lay.boothH * lay.boothGroundH;
        var boothHoleHalfW = boothGroundW / 2 + lay.boothCheek + bpad;
        var boothHoleTop = lay.deckY - bpad;
        var boothHoleBot = lay.boothY + lay.boothGroundH + bpad;
        ctx.beginPath();
        ctx.rect(0, 0, W, H);
        ctx.rect(lay.cx - boothHoleHalfW, boothHoleTop, boothHoleHalfW * 2, boothHoleBot - boothHoleTop);
        ctx.clip('evenodd');
        ctx.globalAlpha = 0.5;
        ctx.globalCompositeOperation = 'lighter';
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(reflC, 0, lay.floorY, W, srcH * 0.5);
        ctx.restore();
      }

      function drawBooth() {
        var b = favg(0, 2), m = favg(8, 15);
        var cx2   = lay.cx;
        var topW  = lay.boothW, textBotW = topW * lay.boothFlare;
        var y0    = lay.boothY, textY1 = y0 + lay.boothH;
        var groundY = y0 + lay.boothGroundH;
        var slope   = (textBotW - topW) / lay.boothH;
        var groundW = topW + slope * (groundY - y0);
        var topX0 = cx2 - topW / 2, topX1 = cx2 + topW / 2;
        var groundX0 = cx2 - groundW / 2, groundX1 = cx2 + groundW / 2;
        var cheek = lay.boothCheek;

        ctx.save();

        // raked side cheeks, running the full height down to the ground
        var cheekGrad = ctx.createLinearGradient(0, y0, 0, groundY);
        cheekGrad.addColorStop(0, '#20202f'); cheekGrad.addColorStop(1, '#0a0a12');
        ctx.fillStyle = cheekGrad; ctx.strokeStyle = '#2a2a3e'; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(topX0 - cheek, y0); ctx.lineTo(topX0, y0); ctx.lineTo(groundX0, groundY); ctx.lineTo(groundX0 - cheek, groundY);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(topX1, y0); ctx.lineTo(topX1 + cheek, y0); ctx.lineTo(groundX1 + cheek, groundY); ctx.lineTo(groundX1, groundY);
        ctx.closePath(); ctx.fill(); ctx.stroke();

        // front face: one continuous panel from the branded fascia down to the ground, no seam
        var bg = ctx.createLinearGradient(0, y0, 0, groundY);
        bg.addColorStop(0, '#181828'); bg.addColorStop(0.35, '#0c0c1c'); bg.addColorStop(1, '#050508');
        ctx.fillStyle = bg;
        ctx.shadowColor = 'rgba(0,140,255,' + (0.18 + b * 0.52) + ')'; ctx.shadowBlur = 14 + b * 24;
        ctx.beginPath();
        ctx.moveTo(topX0, y0); ctx.lineTo(topX1, y0); ctx.lineTo(groundX1, groundY); ctx.lineTo(groundX0, groundY);
        ctx.closePath(); ctx.fill();
        ctx.shadowColor = '#0088ff'; ctx.shadowBlur = 7 + b * 13;
        ctx.strokeStyle = 'hsl(210,100%,' + (38 + b * 32) + '%)'; ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.shadowBlur = 0;

        // LED strip accents: one along the top edge, one marking the base of the branded panel
        var textBotX0 = cx2 - textBotW / 2, textBotX1 = cx2 + textBotW / 2;
        ctx.globalAlpha = 0.3 + b * 0.4; ctx.fillStyle = '#3a8fff';
        ctx.fillRect(topX0 + topW * 0.06, y0 + lay.boothH * 0.05, topW * 0.88, Math.max(1.5, lay.boothH * 0.035));
        ctx.globalAlpha = 0.2 + b * 0.25;
        ctx.fillRect(textBotX0 + textBotW * 0.1, textY1 - lay.boothH * 0.06, textBotW * 0.8, Math.max(1, lay.boothH * 0.025));
        ctx.restore();

        // AZQATO wordmark, branded onto the upper panel
        var textTop = y0 + lay.boothH * 0.32, textBot = textY1 - lay.boothH * 0.14;
        drawBoothWordmark(cx2, (textTop + textBot) / 2, topW * 0.84, textBot - textTop, b);

        // top deck: the surface the CDJs and mixer sit on
        var deckFrontW = lay.deckFrontW, deckBackW = lay.deckBackW, deckY1 = lay.deckY;
        ctx.save();
        var deckGrad = ctx.createLinearGradient(cx2 - deckFrontW / 2, 0, cx2 + deckFrontW / 2, 0);
        deckGrad.addColorStop(0, '#26263a'); deckGrad.addColorStop(0.5, '#33334c'); deckGrad.addColorStop(1, '#26263a');
        ctx.fillStyle = deckGrad; ctx.strokeStyle = '#3a3a52'; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx2 - deckFrontW / 2, y0); ctx.lineTo(cx2 + deckFrontW / 2, y0);
        ctx.lineTo(cx2 + deckBackW / 2, deckY1); ctx.lineTo(cx2 - deckBackW / 2, deckY1);
        ctx.closePath(); ctx.fill(); ctx.stroke();

        // back rail: gives the deck's rear edge visible thickness instead of stopping flat
        var railH = lay.deckH * 0.22, railBackW = deckBackW * 0.94;
        ctx.fillStyle = '#15151f'; ctx.strokeStyle = '#40405a'; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx2 - deckBackW / 2, deckY1); ctx.lineTo(cx2 + deckBackW / 2, deckY1);
        ctx.lineTo(cx2 + railBackW / 2, deckY1 - railH); ctx.lineTo(cx2 - railBackW / 2, deckY1 - railH);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.restore();

        // CDJ bodies + jog wheels
        ctx.save();
        ctx.fillStyle = '#08080e';
        ctx.fillRect(lay.cdjLX, lay.cdjY, lay.cdjW, lay.cdjH);
        ctx.fillRect(lay.cdjRX, lay.cdjY, lay.cdjW, lay.cdjH);
        ctx.globalAlpha = 0.55 + m * 0.35;
        ctx.fillStyle = 'hsl(200,90%,' + (28 + m * 20) + '%)';
        ctx.beginPath(); ctx.arc(lay.cdjLX + lay.cdjW / 2, lay.cdjY + lay.cdjH * 0.5, lay.cdjW * 0.12, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(lay.cdjRX + lay.cdjW / 2, lay.cdjY + lay.cdjH * 0.5, lay.cdjW * 0.12, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        // mixer: static panel bridging the two CDJs
        ctx.save();
        ctx.fillStyle = '#08080e';
        ctx.fillRect(lay.bsX, lay.bsY, lay.bsW, lay.bsH);
        ctx.restore();
      }

      var fireH  = [0,0,0,0];
      // True while any pyro jet is actually burning. The screen flashes are gated
      // on this so a flash never fires on its own: the flash reads as part of the
      // pyro hit rather than as an unexplained blink. Updated in drawFire(), which
      // runs after the flashes in the frame, so this is last frame's state. One
      // frame at 60 fps is 16 ms and is not perceivable.
      var fireActive = false;
      var embers = [];
      function drawFire() {
        var b = favg(0, 2);
        var anyFire = false;
        // rising embers spawned while pyro is active
        for (var e = embers.length - 1; e >= 0; e--) {
          var em = embers[e];
          em.x += em.vx; em.y += em.vy; em.vy *= 0.985; em.life -= 0.016;
          if (em.life <= 0) { embers.splice(e, 1); continue; }
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = em.life * 0.85;
          ctx.strokeStyle = em.life > 0.5 ? '#ffd890' : '#ff7a30';
          ctx.lineWidth = em.s * 0.8;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(em.x, em.y);
          ctx.lineTo(em.x - em.vx * 2.5, em.y - em.vy * 2.5);
          ctx.stroke();
          ctx.restore();
        }
        for (var i = 0; i < lay.fireXs.length; i++) {
          var tgt = b > 0.52 ? (b + freq((i*7+10)%N)*0.3) * H * 0.20 : 0;
          fireH[i] += (tgt - fireH[i]) * 0.16;
          if (fireH[i] >= 3) anyFire = true;
          if (fireH[i] < 3) continue;
          var fx = lay.fireXs[i], fy = lay.fireY, fh = fireH[i];
          if (embers.length < 90 && Math.random() < 0.5) {
            embers.push({
              x: fx + (Math.random() - 0.5) * W * 0.02,
              y: fy - fh * (0.5 + Math.random() * 0.5),
              vx: (Math.random() - 0.5) * 0.9,
              vy: -(1.2 + Math.random() * 2.2),
              s: 1 + Math.random() * 2,
              life: 0.6 + Math.random() * 0.4
            });
          }
          var fw = W * 0.038 + Math.sin(t * 0.18 + i) * W * 0.005;
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          // light pool the jet casts on the stage around its base
          var pool = ctx.createRadialGradient(fx, fy, 0, fx, fy, fh * 0.85);
          pool.addColorStop(0,   'rgba(255,120,20,0.28)');
          pool.addColorStop(0.5, 'rgba(255,60,0,0.10)');
          pool.addColorStop(1,   'rgba(255,40,0,0)');
          ctx.fillStyle = pool;
          ctx.fillRect(fx - fh, fy - fh, fh * 2, fh * 2);
          // three additive tongues: envelope, body, white-hot core
          for (var L = 0; L < 3; L++) {
            var k    = [1, 0.68, 0.38][L];
            var wob  = Math.sin(t * (0.13 + L * 0.05) + i * 2 + L * 1.7);
            var tipX = fx + wob * fw * (0.24 - L * 0.05);
            var lh   = fh * (0.72 + k * 0.28) * (0.94 + 0.06 * Math.sin(t * 0.31 + i + L));
            var lw   = fw * k;
            var grd  = ctx.createLinearGradient(fx, fy, fx, fy - lh);
            if (L === 0) {
              grd.addColorStop(0,    'rgba(255,55,0,0.50)');
              grd.addColorStop(0.55, 'rgba(255,115,10,0.28)');
              grd.addColorStop(1,    'rgba(255,160,40,0)');
            } else if (L === 1) {
              grd.addColorStop(0,    'rgba(255,150,20,0.70)');
              grd.addColorStop(0.6,  'rgba(255,200,60,0.32)');
              grd.addColorStop(1,    'rgba(255,230,120,0)');
            } else {
              grd.addColorStop(0,    'rgba(255,245,200,0.92)');
              grd.addColorStop(0.7,  'rgba(255,220,120,0.38)');
              grd.addColorStop(1,    'rgba(255,255,220,0)');
            }
            ctx.beginPath();
            ctx.moveTo(fx - lw * 0.5, fy);
            ctx.bezierCurveTo(
              fx - lw * (0.55 + 0.10 * wob), fy - lh * 0.4,
              tipX - lw * 0.16,              fy - lh * 0.78,
              tipX,                          fy - lh);
            ctx.bezierCurveTo(
              tipX + lw * 0.16,              fy - lh * 0.78,
              fx + lw * (0.55 - 0.10 * wob), fy - lh * 0.4,
              fx + lw * 0.5,                 fy);
            ctx.closePath();
            ctx.fillStyle = grd;
            ctx.fill();
          }
          ctx.restore();
        }
        fireActive = anyFire;
      }

      // ── D: Lasers, beat flash, crowd ──
      // Two laser fixture units, each has 4 possible beam angles, randomly shows 1-4 at a time.
      var laserFixtures = [
        { xOff: -0.43, beamAngs: [-68, -52, -38, -22], active: 2, timer: 0 },
        { xOff:  0.43, beamAngs: [-158, -142, -128, -112], active: 2, timer: 0 },
      ];

      function drawLaserFixture(fx, fy, energy) {
        var hr  = W * 0.032; // head radius
        var hcy = fy - hr * 1.1; // head center Y (above base)

        ctx.save();

        // Yoke arms
        ctx.strokeStyle = '#252535'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(fx - hr * 0.7, fy); ctx.lineTo(fx - hr * 0.7, hcy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(fx + hr * 0.7, fy); ctx.lineTo(fx + hr * 0.7, hcy); ctx.stroke();

        // Base plate
        ctx.fillStyle = '#1c1c28';
        ctx.fillRect(fx - hr * 1.0, fy, hr * 2, H * 0.016);
        ctx.strokeStyle = '#2e2e42'; ctx.lineWidth = 1;
        ctx.strokeRect(fx - hr * 1.0, fy, hr * 2, H * 0.016);

        // Barrel outer ring
        ctx.beginPath(); ctx.arc(fx, hcy, hr, 0, Math.PI * 2);
        ctx.fillStyle = '#14141e'; ctx.fill();
        ctx.strokeStyle = '#303045'; ctx.lineWidth = 2.5; ctx.stroke();

        // Middle ring
        ctx.beginPath(); ctx.arc(fx, hcy, hr * 0.76, 0, Math.PI * 2);
        ctx.strokeStyle = '#1e1e2e'; ctx.lineWidth = 2; ctx.stroke();

        // Lens gradient (face-on circular lens)
        var lg = ctx.createRadialGradient(fx, hcy, 0, fx, hcy, hr * 0.55);
        lg.addColorStop(0,   'rgba(210,255,255,' + (0.92 + energy * 0.08) + ')');
        lg.addColorStop(0.25,'rgba(0,230,255,'   + (0.80 + energy * 0.20) + ')');
        lg.addColorStop(0.65,'rgba(0,120,180,0.45)');
        lg.addColorStop(1,   'rgba(0,40,80,0.0)');
        ctx.beginPath(); ctx.arc(fx, hcy, hr * 0.55, 0, Math.PI * 2);
        ctx.fillStyle = lg; ctx.fill();

        // Hot-spot bloom
        ctx.shadowColor = '#00eeff';
        ctx.shadowBlur  = 18 + energy * 32;
        ctx.globalAlpha = 0.55 + energy * 0.45;
        ctx.fillStyle   = '#aaffff';
        ctx.beginPath(); ctx.arc(fx, hcy, hr * 0.15, 0, Math.PI * 2); ctx.fill();

        ctx.restore();
        return hcy; // beam origin Y
      }

      function drawLasers() {
        var pk  = favg(0, N - 1);
        var m   = Math.min(1, favg(8, 25) + beatPulse * 0.22);
        var len = Math.max(W, H) * 1.4;

        laserFixtures.forEach(function (fix, fi) {
          // Step active count up or down by 1, clamped 1–4
          fix.timer--;
          if (fix.timer <= 0) {
            var step = Math.random() < 0.5 ? -1 : 1;
            fix.active = Math.min(4, Math.max(1, fix.active + step));
            fix.timer  = 45 + Math.floor(Math.random() * 75);
          }

          var fx  = lay.cx + fix.xOff * W;
          var fy  = lay.fireY;
          var hcy = drawLaserFixture(fx, fy, m);

          for (var i = 0; i < fix.active; i++) {
            var angIdx = Math.floor(i * fix.beamAngs.length / fix.active);
            var deg    = fix.beamAngs[angIdx];
            var ang    = deg * Math.PI / 180 + Math.sin(t * 0.004 + fi * 2 + i * 0.55) * 0.05;
            var hue    = (t * 1.4 + i * 60 + fi * 150) % 360;
            var f      = freq((fi * 16 + i * 6 + 8) % N);
            var ex     = fx + Math.cos(ang) * len;
            var ey     = hcy + Math.sin(ang) * len;
            // beam fades with distance (atmospheric extinction)
            var bg2 = ctx.createLinearGradient(fx, hcy, ex, ey);
            bg2.addColorStop(0,   'hsla(' + hue + ',100%,62%,1)');
            bg2.addColorStop(0.7, 'hsla(' + hue + ',100%,58%,0.5)');
            bg2.addColorStop(1,   'hsla(' + hue + ',100%,55%,0)');
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(fx, hcy);
            ctx.lineTo(ex, ey);
            // pass 1: wide soft haze envelope
            ctx.globalAlpha = 0.05 + f * 0.10;
            ctx.strokeStyle = bg2;
            ctx.lineWidth   = 9 + f * 8;
            ctx.stroke();
            // pass 2: beam body
            ctx.globalAlpha = 0.22 + f * 0.45;
            ctx.lineWidth   = 2.4 + f * 2.4;
            ctx.stroke();
            // pass 3: white-hot core
            var cg2 = ctx.createLinearGradient(fx, hcy, ex, ey);
            cg2.addColorStop(0,    'hsla(' + hue + ',100%,92%,1)');
            cg2.addColorStop(0.55, 'hsla(' + hue + ',100%,85%,0.5)');
            cg2.addColorStop(1,    'hsla(' + hue + ',100%,80%,0)');
            ctx.globalAlpha = 0.35 + f * 0.60;
            ctx.strokeStyle = cg2;
            ctx.lineWidth   = 0.9 + f * 0.9;
            ctx.stroke();
            ctx.restore();
          }

          // lens flare at the emitter aperture
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          var flr = 5 + m * 22;
          var fg2 = ctx.createRadialGradient(fx, hcy, 0, fx, hcy, flr);
          fg2.addColorStop(0,   'rgba(230,255,255,' + (0.45 + m * 0.5) + ')');
          fg2.addColorStop(0.3, 'rgba(120,220,255,0.32)');
          fg2.addColorStop(1,   'rgba(0,150,255,0)');
          ctx.fillStyle = fg2;
          ctx.beginPath(); ctx.arc(fx, hcy, flr, 0, Math.PI * 2); ctx.fill();
          // horizontal anamorphic streak
          ctx.globalAlpha = 0.22 + m * 0.4;
          var sg2 = ctx.createLinearGradient(fx - flr * 2.6, hcy, fx + flr * 2.6, hcy);
          sg2.addColorStop(0,   'rgba(150,230,255,0)');
          sg2.addColorStop(0.5, 'rgba(215,245,255,0.8)');
          sg2.addColorStop(1,   'rgba(150,230,255,0)');
          ctx.fillStyle = sg2;
          ctx.fillRect(fx - flr * 2.6, hcy - 1, flr * 5.2, 2);
          ctx.restore();
        });

        // Hard peak: beams surge bright
        if (pk > 0.80) {
          var fl = (pk - 0.80) * 4;
          laserFixtures.forEach(function (fix, fi) {
            var fx  = lay.cx + fix.xOff * W;
            var hcy = lay.fireY - W * 0.032 * 1.1;
            for (var i = 0; i < fix.active; i++) {
              var angIdx = Math.floor(i * fix.beamAngs.length / fix.active);
              var ang    = fix.beamAngs[angIdx] * Math.PI / 180;
              var hue    = (t * 1.4 + i * 60 + fi * 150) % 360;
              var ex     = fx + Math.cos(ang) * len;
              var ey     = hcy + Math.sin(ang) * len;
              var pg = ctx.createLinearGradient(fx, hcy, ex, ey);
              pg.addColorStop(0,   'hsla(' + hue + ',100%,72%,1)');
              pg.addColorStop(0.7, 'hsla(' + hue + ',100%,65%,0.5)');
              pg.addColorStop(1,   'hsla(' + hue + ',100%,60%,0)');
              ctx.save();
              ctx.globalCompositeOperation = 'lighter';
              ctx.lineCap = 'round';
              ctx.beginPath();
              ctx.moveTo(fx, hcy);
              ctx.lineTo(ex, ey);
              // surge halo
              ctx.globalAlpha = fl * 0.28;
              ctx.strokeStyle = pg;
              ctx.lineWidth   = 12 + fl * 8;
              ctx.stroke();
              // surge body
              ctx.globalAlpha = fl * 0.55;
              ctx.lineWidth   = 3.5 + fl * 3;
              ctx.stroke();
              ctx.restore();
            }
          });
        }
      }

      function drawBeatFlash() {
        // Driven by the kick detector, not by a level threshold. The old test was
        // `favg(0, 5) >= 0.76`, which on a loud master is either true continuously
        // or never, and in both cases reads as no reaction at all.
        // Scaled to 0.26 on the audio path, halved from the original 0.55. The
        // refractory in updateBeat now caps this at 1.67 events per second at any
        // refresh rate, but rate is only half of photosensitivity: the size of the
        // luminance step matters as much as its frequency. Impact is carried by
        // the screen zoom, the crowd and the lasers, all of which are motion
        // rather than luminance, while this full-width light pump stays a gentle
        // swell. Do not raise it.
        // Gated on the pyro: no fire, no flash. A light pump with nothing visibly
        // making it reads as a glitch; with the jets firing behind it, it reads as
        // the blast throwing light across the room, which is what it is meant to be.
        if (!fireActive) return;
        var a = audioLive ? beatPulse * 0.26 : Math.max(0, favg(0, 5) - 0.76) * 2;
        if (a <= 0.01) return;
        // radial light pump from the stage instead of a flat full-screen flash
        var fy = lay.mainY + lay.mainH * 0.7;
        var g = ctx.createRadialGradient(lay.cx, fy, 0, lay.cx, fy, Math.max(W, H) * 0.85);
        g.addColorStop(0,   'rgba(205,225,255,' + (a * 0.10) + ')');
        g.addColorStop(0.35,'rgba(130,160,255,' + (a * 0.035) + ')');
        g.addColorStop(1,   'rgba(0,0,0,0)');
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        ctx.restore();
      }

      // ── Atmosphere: haze drifting through the light field + dust motes ──
      var hazeBlobs = Array.from({ length: 4 }, function (_, i) {
        return { spd: 0.0011 + i * 0.0007, ph: i * 1.9, yF: 0.16 + (i % 3) * 0.14, hue: 215 + i * 28 };
      });

      function drawHaze() {
        var b = favg(0, 3);
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        for (var i = 0; i < hazeBlobs.length; i++) {
          var hb = hazeBlobs[i];
          var hx = lay.cx + Math.sin(t * hb.spd + hb.ph) * W * 0.34;
          var hy = H * hb.yF + Math.sin(t * hb.spd * 1.6 + hb.ph * 2.1) * H * 0.05;
          var hr = W * (0.16 + 0.05 * Math.sin(t * 0.002 + hb.ph));
          var hg = ctx.createRadialGradient(hx, hy, 0, hx, hy, hr);
          hg.addColorStop(0, 'hsla(' + hb.hue + ',60%,55%,' + (0.028 + b * 0.026) + ')');
          hg.addColorStop(1, 'hsla(' + hb.hue + ',60%,55%,0)');
          ctx.fillStyle = hg;
          ctx.fillRect(hx - hr, hy - hr, hr * 2, hr * 2);
        }
        ctx.restore();
      }

      var dust = Array.from({ length: 56 }, function () {
        return { x: Math.random(), y: Math.random() * 0.72, z: 0.3 + Math.random() * 0.7, ph: Math.random() * 6.28 };
      });

      function drawDust() {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = '#cfe4ff';
        for (var i = 0; i < dust.length; i++) {
          var d = dust[i];
          d.x += 0.00016 * d.z; d.y -= 0.00009 * d.z;
          if (d.x > 1.02) d.x = -0.02;
          if (d.y < -0.02) d.y = 0.74;
          var tw = Math.abs(Math.sin(t * 0.02 + d.ph));
          ctx.globalAlpha = (0.05 + tw * 0.13) * d.z;
          var sz = 0.5 + d.z * 1.1;
          ctx.fillRect(d.x * W, d.y * H, sz, sz);
        }
        ctx.restore();
      }

      function drawCrowd() {
        var b = favg(0, 2);
        ctx.save();
        // back row: further away, smaller, catches faint ambient blue
        ctx.fillStyle = '#0a0a18';
        for (var j = 0; j < 85; j++) {
          var bx2 = (j / 85) * W + Math.sin(j * 7.3) * (W / 110);
          var bh2 = H * 0.026 + Math.abs(Math.sin(j * 2.9)) * H * 0.016;
          var bw2 = 4 + Math.sin(j * 5.2) * 1.5;
          var bob2 = Math.abs(Math.sin(t * 0.05 + j * 1.31)) * (1 + b * 5 + beatPulse * 2.5);
          var byT = H - H * 0.012 - bh2 - bob2;
          ctx.fillRect(bx2 - bw2 / 2, byT, bw2, bh2 + bob2 + H * 0.02);
          ctx.beginPath(); ctx.arc(bx2, byT, bw2 * 0.55, 0, Math.PI * 2); ctx.fill();
        }
        // front row: pure silhouette, bounces harder on the beat
        ctx.fillStyle = '#000';
        for (var i = 0; i < 65; i++) {
          var px = (i / 65) * W + Math.sin(i * 4.6) * (W / 95);
          var ph = H * 0.042 + Math.abs(Math.sin(i * 2.2)) * H * 0.028;
          var pw2 = 6 + Math.sin(i * 3.1) * 2;
          var bob = Math.abs(Math.sin(t * 0.055 + i * 0.83)) * (1.5 + b * 9 + beatPulse * 5);
          var hy = H - ph - bob;
          ctx.fillRect(px - pw2 / 2, hy, pw2, ph + bob);
          ctx.beginPath(); ctx.arc(px, hy, pw2 * 0.52, 0, Math.PI * 2); ctx.fill();
          if (i % 5 === 0 || b > 0.62) {
            ctx.fillRect(px + pw2 * 0.25, hy - ph * 0.35, 2.5, ph * 0.35);
            // phone light held up on the loudest hits
            if (i % 10 === 0 && b > 0.55) {
              ctx.save();
              ctx.globalAlpha = 0.35 + b * 0.5;
              ctx.fillStyle = '#bfe8ff';
              ctx.shadowColor = '#88ccff'; ctx.shadowBlur = 6;
              ctx.fillRect(px + pw2 * 0.1, hy - ph * 0.35 - 4, 3.4, 5);
              ctx.restore();
              ctx.fillStyle = '#000';
            }
          }
        }
        ctx.restore();
      }

      // ── Mode button sync ──
      var modeBtns = document.querySelectorAll('.mode-btn');
      function syncModeBtns() {
        modeBtns.forEach(function(b) {
          b.classList.toggle('active', +b.getAttribute('data-mode') === screenMode);
        });
      }
      modeBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          screenMode = +btn.getAttribute('data-mode');
          modeTimer = 0;
          syncModeBtns();
          if (!rafId) draw();  // show the picked mode even while paused
        });
      });

      // ── Favicon ──
      var favCanvas = document.createElement('canvas');
      favCanvas.width = favCanvas.height = 32;
      var favCtx  = favCanvas.getContext('2d');
      var favLink = document.querySelector("link[rel='icon']") || document.createElement('link');
      favLink.rel = 'icon';
      if (!favLink.parentNode) document.head.appendChild(favLink);
      var favTick = 0;

      function updateFavicon() {
        favCtx.clearRect(0, 0, 32, 32);
        for (var i = 0; i < 12; i++) {
          var ang = (i / 12) * Math.PI * 2 - Math.PI / 2;
          var f   = freq(i * 2);
          var hue = 195 + f * 65;
          favCtx.strokeStyle = 'hsl(' + hue + ',100%,70%)';
          favCtx.shadowColor = 'hsl(' + hue + ',100%,65%)';
          favCtx.shadowBlur  = 3; favCtx.lineWidth = 2.5;
          favCtx.beginPath();
          favCtx.moveTo(16 + Math.cos(ang) * 8,          16 + Math.sin(ang) * 8);
          favCtx.lineTo(16 + Math.cos(ang) * (8 + 2 + f*8), 16 + Math.sin(ang) * (8 + 2 + f*8));
          favCtx.stroke();
        }
        favLink.href = favCanvas.toDataURL();
      }

      // ── Main loop ──
      function draw() {
        t++;
        sampleAudio();
        updateBeat();
        updateLoudFlash();
        // Audio-reactive clock for the WebGL screens: runs faster through louder
        // passages and jumps forward on each detected kick, so the shaders drift
        // with the track instead of on their own fixed timebase.
        glTime += (1 / 60) * (0.6 + favg(0, 30) * 1.6) + beatPulse * 0.05;

        // Cycle screen mode on a wall clock (active modes: stars, vortex, squares,
        // tunnel, fence). This was a frame count, so the panel swapped twice as
        // often on a 120 Hz display as the 30 s in the comment claimed.
        modeTimer += frameMs;
        if (modeTimer >= MODE_LEN) { modeTimer = 0; var activeModes = [2, 3, 4, 6, 8]; var next; do { next = activeModes[Math.floor(Math.random() * activeModes.length)]; } while (next === screenMode); screenMode = next; syncModeBtns(); }
        if      (screenMode === 1) renderGL1();
        else if (screenMode === 2) renderGL2();
        else if (screenMode === 3) renderGL3();
        else if (screenMode === 4) renderGL4();
        else if (screenMode === 5) renderGL5();
        else if (screenMode === 6) renderGL6();
        else if (screenMode === 7) renderGL7();
        else if (screenMode === 8) renderGL8();
        else if (screenMode === 9) renderGL9();
        fxSrc = (screenMode >= 1 && gl) ? glCanvas : null;

        drawBg();
        drawBeatFlash();
        drawTruss(lay.truss1Y, 12); drawTruss(lay.truss2Y, 8); drawTruss(lay.truss3Y, 5);
        drawTrussLights(lay.truss1Y, 11); drawTrussLights(lay.truss2Y, 7);

        if (screenMode === 0) {
          drawGrid(lay.mainX, lay.mainY, lay.mainW, lay.mainH, lay.mainCols, lay.mainRows, mainCell);
        } else {
          drawImagePanel(lay.mainX, lay.mainY, lay.mainW, lay.mainH);
        }
        drawWingScreen('L'); drawWingScreen('R');
        drawStageFloor();
        drawReflection();
        drawBooth();
        drawFire();
        drawLasers();
        drawDust();
        drawHaze();
        drawCrowd();
        // cinematic grade: vignette + letterbox
        ctx.drawImage(vigC, 0, 0, W, H);
        if (++favTick % 3 === 0) updateFavicon();
      }

      // ── Motion control ──
      // Visitors who asked their OS to reduce motion get the stage painted once
      // and left still; everyone else gets a way to stop it (WCAG 2.2.2).
      var motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
      var motionBtn = document.getElementById('motion-toggle');
      var rafId = null;

      function loop(now) {
        tickClock(typeof now === 'number' ? now : performance.now());
        draw();
        rafId = requestAnimationFrame(loop);
      }

      function setPlaying(on) {
        if (on && !rafId) { lastFrameT = 0; loop(); }
        if (!on && rafId) { cancelAnimationFrame(rafId); rafId = null; }
        if (motionBtn) {
          motionBtn.textContent = on ? 'Pause' : 'Play';
          motionBtn.setAttribute('aria-pressed', on ? 'false' : 'true');
          motionBtn.setAttribute('aria-label', on ? 'Pause the stage animation' : 'Play the stage animation');
        }
      }

      if (motionBtn) {
        motionBtn.addEventListener('click', function () { setPlaying(!rafId); });
      }

      // ── Native track player ──
      var playBtn  = document.getElementById('trackPlayBtn');
      var playIcon = document.getElementById('trackPlayIcon');
      var seek     = document.getElementById('trackSeek');
      var curEl    = document.getElementById('trackCurrent');
      var durEl    = document.getElementById('trackDuration');
      var seeking  = false;

      function fmtTime(s) {
        if (!isFinite(s) || s < 0) s = 0;
        var m = Math.floor(s / 60);
        var r = Math.floor(s % 60);
        return m + ':' + (r < 10 ? '0' : '') + r;
      }

      // The tag under the title claims the track drives the visualizer. On a
      // local file that is a lie, because the browser treats the same-folder mp3
      // as cross-origin and the page skips Web Audio entirely. Say so rather than
      // letting the stage run its idle animation and look like a broken feature.
      // The credit line above stays put. Only the note under it changes, so the
      // artists are named whether or not the visualizer can hear anything.
      var trackNote = document.getElementById('trackNote');
      if (trackNote && !canRouteAudio) {
        trackNote.textContent = 'Serve over http to make the visualizer react';
      }

      if (trackAudio && playBtn) {
        playBtn.addEventListener('click', function () {
          if (trackAudio.paused) {
            // Must happen inside the click: browsers only allow an AudioContext
            // to start from a user gesture.
            initAudio();
            wireAudio(trackAudio);
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            trackAudio.play();
          } else {
            trackAudio.pause();
          }
        });

        trackAudio.addEventListener('play', function () {
          playIcon.innerHTML = '&#10073;&#10073;';
          playBtn.setAttribute('aria-label', 'Pause track');
        });

        trackAudio.addEventListener('pause', function () {
          playIcon.innerHTML = '&#9654;';
          playBtn.setAttribute('aria-label', 'Play track');
        });

        trackAudio.addEventListener('loadedmetadata', function () {
          seek.max = trackAudio.duration || 0;
          seek.disabled = false;
          durEl.textContent = fmtTime(trackAudio.duration);
        });

        trackAudio.addEventListener('timeupdate', function () {
          if (seeking) return;
          seek.value = trackAudio.currentTime;
          curEl.textContent = fmtTime(trackAudio.currentTime);
        });

        trackAudio.addEventListener('ended', function () {
          seek.value = 0;
          curEl.textContent = '0:00';
        });

        seek.addEventListener('input', function () {
          seeking = true;
          curEl.textContent = fmtTime(+seek.value);
        });

        seek.addEventListener('change', function () {
          trackAudio.currentTime = +seek.value;
          seeking = false;
        });
      }

      // Always paint one frame so the stage is never blank, then run it unless
      // the visitor has asked us not to.
      draw();
      setPlaying(!motionQuery.matches);
    })();

    /* ── NAV TOGGLE ── */
    (function () {
      var toggle = document.querySelector('.nav-toggle');
      var links = document.querySelector('.nav-links');
      if (!toggle || !links) return;
      toggle.addEventListener('click', function () {
        var open = links.classList.toggle('open');
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      links.addEventListener('click', function (e) {
        if (e.target.tagName === 'A') {
          links.classList.remove('open');
          toggle.setAttribute('aria-expanded', 'false');
        }
      });
      document.addEventListener('click', function (e) {
        if (!links.contains(e.target) && !toggle.contains(e.target)) {
          links.classList.remove('open');
          toggle.setAttribute('aria-expanded', 'false');
        }
      });
    })();
  </script>
</body>
</html>
