name: Update Screener Data (Nasdaq 100)

# Daily refresh of data/screener.json for the Nasdaq 100 screener (the default
# view). Runs FIRST, 30 minutes ahead of the larger S&P 500 job, so the most-used
# view always refreshes promptly and never waits on the 500-symbol fetch.
# Uses yfinance (public Yahoo Finance data) -- no API key, no per-symbol
# subscription limits, so the whole list is refreshed every run.

on:
  schedule:
    # 23:00 UTC = 6:00pm US Eastern in winter (EST).
    # GitHub cron is UTC-only and does not follow DST: in summer (EDT) this
    # fires at 7:00pm Eastern. For 6:00pm during summer instead, use "0 22 * * *".
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # allow manual runs

permissions:
  contents: write

concurrency:
  group: screener-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch screener data
        run: |
          pip install --quiet --upgrade yfinance
          python scripts/fetch_screener_data.py --list data/nasdaq100.json --out data/screener.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/screener.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update screener data (Nasdaq 100) [skip ci]"
            git push
          fi
