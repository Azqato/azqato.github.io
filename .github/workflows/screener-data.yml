name: Update Screener Data

# Daily refresh of data/screener.json for the Nasdaq 100 screener.
# Refreshes all prices each run plus a rotating slice of fundamentals,
# keeping a single run under the FMP free tier's 250 requests/day.

on:
  schedule:
    # 23:00 UTC = 6:00pm US Eastern in winter (EST).
    # GitHub cron is UTC-only and does not follow DST: in summer (EDT) this
    # fires at 7:00pm Eastern. For 6:00pm during summer instead, use "0 22 * * *".
    - cron: "0 23 * * *"
  workflow_dispatch:        # allow manual runs (e.g. to backfill faster)
    inputs:
      daily_count:
        description: "Symbols to fully refresh this run"
        required: false
        default: "50"

permissions:
  contents: write

concurrency:
  group: screener-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch screener data
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DAILY_COUNT: ${{ github.event.inputs.daily_count || '50' }}
          REQ_BUDGET: "240"
        run: node scripts/fetch-screener-data.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/screener.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update screener data [skip ci]"
            git push
          fi
