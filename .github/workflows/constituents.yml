name: Update Constituents

# Weekly sync of the screener's constituent lists: data/nasdaq100.json and
# data/sp500.json with the live indices (from Wikipedia), and data/vug.json,
# data/vtv.json, data/vig.json, data/vxus.json with the top 100 holdings of
# the matching Vanguard ETFs (from Vanguard's profile API, which publishes
# monthly). VXUS holdings are additionally resolved from ISIN to a suffixed
# Yahoo symbol via data/vxus_map.json (see update_etf_constituents.py). For
# whichever list's membership changed, regenerates the matching data feed and
# commits the lists + feeds. Runs Saturday, when the daily screener-data jobs
# are idle (those run Mon-Fri / Tue-Sat only; 23:00 Sat is clear of the 00:00
# Sat GVD run and the 00:15 Sat International run).

on:
  schedule:
    - cron: "0 23 * * 6"   # Saturdays 23:00 UTC (same time as the weekday data jobs)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: screener-data    # share the data workflow's group so commits never race
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sync constituent lists
        run: |
          pip install --quiet requests pandas lxml
          python scripts/update_constituents.py
          python scripts/update_etf_constituents.py

      - name: Regenerate changed feeds and commit
        run: |
          changed=0
          pip install --quiet yfinance==1.4.1
          if ! git diff --quiet data/nasdaq100.json; then
            echo "Nasdaq 100 membership changed; regenerating feed."
            python scripts/fetch_screener_data.py --list data/nasdaq100.json --out data/screener.json
            git add data/nasdaq100.json data/screener.json
            changed=1
          fi
          if ! git diff --quiet data/sp500.json || [ -n "$(git status --porcelain data/sp500.json)" ]; then
            echo "S&P 500 membership changed (or list is new); regenerating feed."
            python scripts/fetch_screener_data.py --list data/sp500.json --out data/screener_sp500.json
            git add data/sp500.json data/screener_sp500.json
            changed=1
          fi
          if ! git diff --quiet data/vug.json data/vtv.json data/vig.json; then
            echo "ETF holdings changed; regenerating the combined GVD feed."
            python scripts/fetch_screener_data.py --combined growth=data/vug.json --combined value=data/vtv.json --combined dividend=data/vig.json --out data/screener_gvd.json
            git add data/vug.json data/vtv.json data/vig.json data/screener_gvd.json
            changed=1
          fi
          if ! git diff --quiet data/vxus.json; then
            echo "VXUS holdings changed; regenerating the International feed."
            python scripts/fetch_screener_data.py --list data/vxus.json --out data/screener_intl.json
            git add data/vxus.json data/screener_intl.json
            changed=1
          fi
          # The ISIN->symbol resolution cache can change even when membership
          # doesn't (e.g. a newly-resolved holding that later dropped back out
          # of the top 100), so stage and check it independently of the diff above.
          if ! git diff --quiet data/vxus_map.json; then
            git add data/vxus_map.json
            changed=1
          fi
          if [ "$changed" -eq 0 ]; then
            echo "Constituents unchanged; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update index constituents [skip ci]"
          git push
