name: Update Constituents

# Weekly sync of data/nasdaq100.json with the live Nasdaq-100 index (from
# Wikipedia). If membership changed, regenerates the data feed and commits both.

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: screener-data    # share the data workflow's group so commits never race
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync constituent list
        run: |
          pip install --quiet requests pandas lxml
          python scripts/update_constituents.py

      - name: Regenerate feed and commit if the list changed
        run: |
          if git diff --quiet data/nasdaq100.json; then
            echo "Constituents unchanged; nothing to do."
            exit 0
          fi
          pip install --quiet yfinance
          python scripts/fetch_screener_data.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nasdaq100.json data/screener.json
          git commit -m "chore: update Nasdaq 100 constituents [skip ci]"
          git push
