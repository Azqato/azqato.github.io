name: Update Screener Data (S&P 500)

# Daily refresh of data/screener_sp500.json for the screener's "Expand to S&P 500"
# view. Runs 30 minutes AFTER the Nasdaq 100 job so the default view always has
# priority; this larger ~500-symbol fetch takes ~20 minutes.
# Shares the "screener-data" concurrency group so it never pushes at the same time
# as the Nasdaq job or the constituent sync.

on:
  schedule:
    - cron: "30 23 * * *"   # 30 min after the Nasdaq 100 run
  workflow_dispatch: {}      # allow manual runs (use this to seed the feed the first time)

permissions:
  contents: write

concurrency:
  group: screener-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch screener data
        run: |
          pip install --quiet --upgrade yfinance
          python scripts/fetch_screener_data.py --list data/sp500.json --out data/screener_sp500.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/screener_sp500.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update screener data (S&P 500) [skip ci]"
            git push
          fi
