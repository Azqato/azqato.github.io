name: Update Screener Data (International)

# Refresh of data/screener_intl.json, the feed for the screener's International
# universe (top 100 holdings of VXUS, Vanguard Total International Stock ETF).
# Runs Mon-Fri (trading days), 15 minutes AFTER the Growth/Value/Dividend job --
# which puts it at 00:15 UTC the NEXT calendar day, hence the Tue-Sat cron.
# Shares the "screener-data" concurrency group so it never pushes at the same
# time as the other data jobs or the constituent sync.

on:
  schedule:
    - cron: "15 0 * * 2-6"   # 15 min after the GVD run; Tue-Sat UTC = Mon-Fri US trading days
  workflow_dispatch: {}       # allow manual runs (use this to seed the feed the first time)

permissions:
  contents: write

concurrency:
  group: screener-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch screener data
        run: |
          pip install --quiet yfinance==1.4.1
          python scripts/fetch_screener_data.py --list data/vxus.json --out data/screener_intl.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/screener_intl.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update screener data (International) [skip ci]"
            git push
          fi
